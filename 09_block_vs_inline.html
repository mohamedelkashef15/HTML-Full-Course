<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block vs Inline</title>
    <style>
      h2 {
        background-color: red;
      }

      a {
        background-color: red;
      }
    </style>
  </head>
  <body>
    <h1>Block vs Inline Elements</h1>

    <!-- Block Elements -->
    <h2>Heading Two</h2>
    <h3>Heading Three</h3>
    <p>This is a paragraph One</p>
    <p>This is a paragraph Two</p>

    <!-- Inline Elements -->
    <a href="https://google.com">Google</a>
    <a href="https://facebook.com">Facebook</a>

    <br />

    <img src="./image.jpg" width="200px" alt="" />
    <img src="./image.jpg" width="200px" alt="" />
  </body>
</html>
