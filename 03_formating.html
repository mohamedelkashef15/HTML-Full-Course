<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Formating</title>
  </head>
  <body>
    <!-- 
        <b> - Bold text
        <strong> - Important text
        <i> - Italic text
        <u> - underline
        <mark> - Marked text
        <small> - Smaller text
        <span> - inline container
        <del> - Deleted text
        <sub> - Subscript text
        <sup> - Superscript text
        <br> - Break line
        <hr> - Horizontal line
        HTML entites
    -->

    <p>This is a <b>bold</b> text</p>
    <p>This is a <strong>strong</strong> text</p>

    <p>This is a <i>Italic</i> text</p>

    <p>This is <mark>important</mark> information.</p>

    <p>This is <small>small text</small>.</p>

    <p>Welcome to <span style="color: green">my website</span>.</p>

    <p>The price is <del>$100</del> $80.</p>

    <p>H<sub>2</sub>O</p>

    x<sup>2</sup>

    <p>
      This the first line <br />
      This is the second line
    </p>

    <hr />

    <p>&copy; all right reserved</p>
  </body>
</html>
