<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global vs Local Attributes</title>

    <style>
      .text {
        color: green;
      }
    </style>
  </head>
  <body>
    <h1>Global vs Local Attributes</h1>

    <!--
    Global Attributes
      - id => unique
      - class 

    هي عبارة عن عناصر تقدر انك تستخدمها مع اغلب ال HTML Elements
      - id => Unique 
      - class 

    Local Attributes
      
-->
    <p id="main">This is the main paragraph</p>

    <p class="text">First Paragraph</p>
    <p class="text">Second Paragraph</p>
    <p class="text">Third Paragraph</p>
  </body>
</html>
